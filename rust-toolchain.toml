# ═════════════════════════════════════════════════════════════════
# このリポが使う toolchain を決める（開発機ごとの既定ではなく）。
#
# 入れた理由は「新しくしたい」ではなく「揃っていなかった」。lint を出すのは古い版の方なので
# （ある版で赤い clippy の lint が、次の版では緑になることがある）、版が揃っていないと
# 「緑の環境の人が、赤い環境では commit できない物を push する」ことになる。
#
# ─────────────────────────────────────────────────────────────────
# 重要: `rust-toolchain.toml` は cwd の祖先から探される（manifest からではない、
#    `.cargo/config.toml` と同じ探し方）。∴ 隣のリポに置いた物は効かない。リポごとに 1 つ要る。
#
# `targets` は書かない。target は開発機ごとの事情であって版の話ではない。
# 書くと全員が全 target を取りに行く。
#
# 重要: pin は target を引き継がない。rustup は pin された版を別の toolchain として新規に入れるので、
#    それまで `stable` に足してあった target は 1 つも付いてこない。
#    開発機ごとに 1 度 `rustup target add …` を撃つ（そこで要る target だけ）。
#    これは `targets` を書かない選択の代償。
#
# 注意: `components` は要る。pre-commit には「clippy が無いので飛ばした」という分岐が在り、
#    fmt の門も在る（道具が無いと門が黙る）。
#
# 決まっていないこと: 誰がいつ版を上げるか。pin は「揃う」を作ると同時に「古いまま固まる」も作る。
#    上げる commit は全員のビルドを一斉に変えるので、各 OS で確かめてから入れること。
#
# これは「配った物がどの道具で焼かれたか」を解決しない。同じ commit を別の toolchain で焼くと
#    sha256 は違うのに `--version` は同じになる。pin は揃えるのであって、名乗らせるのではない。
# ═════════════════════════════════════════════════════════════════
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
