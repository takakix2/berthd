[package]
name = "berth-protocol"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Wire contract for talking to berthd: framed session protocol over a local endpoint"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["io-util", "net", "time"] }
dirs = "5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
